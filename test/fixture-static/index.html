<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture home</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --ink:#171717; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --ink:#f5f5f5; } }
    body { margin:0; padding:16px; font:16px/1.5 sans-serif; background:var(--bg); color:var(--ink); }
    a { color:inherit; } input { font-size:16px; }
  </style>
</head>
<body>
  <main>
    <h1>A small static site</h1>
    <p>site-qa's own CI installs the kit here and expects a clean run.</p>
    <p><a href="about.html">About</a></p>
    <label>Search <input type="search" name="q"></label>
    <nav aria-label="Panels">
      <button type="button" data-panel="notes">Notes</button>
      <button type="button" data-panel="help">Help</button>
    </nav>
    <section class="panel" id="notes" hidden aria-label="Notes"><h2>Notes</h2><p>A view with no URL of its own.</p></section>
    <section class="panel" id="help" hidden aria-label="Help"><h2>Help</h2><p>Another one.</p></section>
  </main>
  <script>
    for (const b of document.querySelectorAll('[data-panel]')) b.addEventListener('click', () => {
      for (const p of document.querySelectorAll('.panel')) { p.hidden = p.id !== b.dataset.panel; p.toggleAttribute('data-open', !p.hidden); }
    });
  </script>
</body>
</html>
